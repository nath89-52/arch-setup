# apps.conf : la liste de tes apps et dotfiles (lue par arch-setup.sh et tui.py)
#
# Apps      : Catégorie|Nom affiché|source (pacman/aur/flatpak/appimage)|nom du paquet|description
#             Pour appimage, le « paquet » est un lien direct, ou github:owner/repo
#             pour toujours prendre la dernière version publiée sur GitHub.
# Dotfiles  : @dotfiles|Nom affiché|URL git|dossier cloné|commande à lancer dedans
#
# Une ligne = une entrée. Pour une nouvelle catégorie, écris juste un nouveau nom :
# elle apparaît toute seule dans l'interface.

# ---------- Dotfiles (choix unique) ----------
@dotfiles|Satoxyan - expressive-pC|https://github.com/Satoxyan/dots-hyprfork.git|dots-hyprfork|./setup install

